# ─────────────────────────────────────────────
# render.yaml  –  Infrastructure-as-code for Render
# Defines 3 resources: PostgreSQL DB, FastAPI backend, React static site
# ─────────────────────────────────────────────

databases:
  - name: chess-db
    databaseName: chess
    user: chess_user
    plan: free

services:
  # ── 1. FastAPI Backend ──────────────────────────────────────────────────────
  - type: web
    name: chess-backend
    plan: free
    runtime: python
    rootDir: backend         # Render will cd into this folder
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chess-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true      # Render auto-generates a secure random value
      - key: FRONTEND_URL
        sync: false              # You will fill this in after the static site is created

  # ── 2. React Frontend (Static Site) ────────────────────────────────────────
  - type: web
    name: chess-frontend
    plan: free
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html   # SPA fallback so React Router works
    envVars:
      - key: VITE_API_URL
        sync: false                # You will fill this in with the backend URL
