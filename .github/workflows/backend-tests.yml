name: Backend CI – Pruebas Unitarias (HU-1, HU-2)

on:
  push:
    branches: ["main", "develop", "feature/**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    name: pytest – Backend test suite
    runs-on: ubuntu-latest

    env:
      # SQLite en memoria para CI – sin base de datos externa
      DATABASE_URL: "sqlite://"
      SECRET_KEY: "ci-secret-key-not-for-production"

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout del código
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 2. Configurar Python
      # ------------------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      # ------------------------------------------------------------------
      # 3. Instalar dependencias del backend + extras de testing
      # ------------------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov httpx

      # ------------------------------------------------------------------
      # 4. Ejecutar toda la suite de tests del backend
      #    (recoge automáticamente cualquier test_hu*.py nuevo que se agregue)
      # ------------------------------------------------------------------
      - name: Run backend test suite
        run: |
          python -m pytest backend/tests/ \
            -v \
            --tb=short \
            --cov=backend \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      # ------------------------------------------------------------------
      # 5. Resumen legible en el panel de GitHub Actions
      # ------------------------------------------------------------------
      - name: Test summary
        if: always()
        run: |
          echo "## 🧪 Resultado de Pruebas Unitarias" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python -m pytest backend/tests/ --tb=no -q 2>&1 | tail -3 >> $GITHUB_STEP_SUMMARY

      # ------------------------------------------------------------------
      # 6. Publicar reporte de cobertura como artefacto descargable
      # ------------------------------------------------------------------
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

