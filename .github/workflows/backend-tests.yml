name: Backend CI – Tests HU-1

on:
  push:
    branches: ["main", "develop", "feature/**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    name: Run pytest (HU-1 Auth Tests)
    runs-on: ubuntu-latest

    env:
      # Usamos SQLite en memoria para CI – sin base de datos externa
      DATABASE_URL: "sqlite://"
      SECRET_KEY: "ci-secret-key-not-for-production"

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout del código
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 2. Configurar Python
      # ------------------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      # ------------------------------------------------------------------
      # 3. Instalar dependencias del backend + extras de testing
      # ------------------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov httpx

      # ------------------------------------------------------------------
      # 4. Ejecutar tests de HU-1
      # ------------------------------------------------------------------
      - name: Run HU-1 Auth tests
        run: |
          python -m pytest backend/tests/test_hu1_auth.py \
            -v \
            --tb=short \
            --cov=backend \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      # ------------------------------------------------------------------
      # 5. Publicar reporte de cobertura (visible en el PR como artefacto)
      # ------------------------------------------------------------------
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30
